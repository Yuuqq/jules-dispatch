name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or situation where jules-dispatch falls short today.
      placeholder: "When I dispatch 20 tasks across 3 repos, I can't..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? CLI flag, MCP tool, config option, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you're using today, or other designs that could work.
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Which surface does this affect?
      multiple: true
      options:
        - CLI
        - MCP server
        - LLM planner
        - Task file format
        - Docs
    validations:
      required: false
